[providers]
provider = "node"

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
    "npm install --no-audit --no-fund",
    "npm install --prefix backend --no-audit --no-fund",
    "npm install --prefix frontend --no-audit --no-fund"
]

[phases.build]
cmds = [
    "npm run build --prefix frontend"
]

[start]
cmd = "node backend/server.js"
